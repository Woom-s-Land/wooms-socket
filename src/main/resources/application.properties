spring.application.name=mychat
spring.main.web-application-type=none
wooms.socket.host=127.0.0.1
wooms.socket.port=8090
wooms.socket.path=/ws
wooms.socket.backend-url=http://localhost:8080
wooms.socket.allowed-origins=http://localhost:5173,http://localhost:3000
wooms.socket.max-frame-bytes=65536
wooms.socket.room-threads=4
wooms.socket.backend-timeout=5s
wooms.socket.storage-secret=${WOOMS_REALTIME_INTERNAL_SECRET:}
netty.tcp-port=8090
netty.boss-count=1
netty.worker-count=10
netty.keep-alive=true
netty.backlog=100

spring.profiles.include=auth

